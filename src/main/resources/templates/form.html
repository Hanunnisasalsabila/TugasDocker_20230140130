<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Form Input Mahasiswa</title>
</head>
<body style="font-family: sans-serif; margin: 40px;">
<h2>Form Input Mahasiswa</h2>

<form action="/submit" method="post" th:object="${user}">
    <div style="margin-bottom: 15px;">
        <label>Nama:</label><br>
        <input type="text" name="nama" th:field="*{nama}" style="width: 300px;" required>
    </div>

    <div style="margin-bottom: 15px;">
        <label>NIM:</label><br>
        <input type="text" name="nim" th:field="*{nim}" style="width: 300px;" required>
    </div>

    <div style="margin-bottom: 20px;">
        <label>Jenis Kelamin:</label><br>
        <input type="radio" id="laki" name="jenis_kelamin" value="Laki-laki" th:field="*{jenis_kelamin}" required>
        <label for="laki">Laki-laki</label><br>

        <input type="radio" id="perempuan" name="jenis_kelamin" value="Perempuan" th:field="*{jenis_kelamin}" required>
        <label for="perempuan">Perempuan</label>
    </div>

    <button type="submit" style="background-color: #007bff; color: white; padding: 5px 15px; border: none; cursor: pointer; margin-bottom: 10px;">Submit</button>
</form>

<a th:href="@{/home}" style="text-decoration: none; color: #007bff;">Kembali ke Home</a>
</body>
</html>
